<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Nandan BM - Interactive ID Card</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&display=swap" rel="stylesheet">
    <style>
        body { 
            margin: 0; 
            font-family: 'Inter', sans-serif; 
            background: #050505;
            color: white;
        }
        .hero {
            height: 100vh;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            background: #050505;
            overflow: hidden;
        }

        .lanyard {
            position: relative;
            margin-top: 20px;
        }

        .lanyard::before {
            content: '';
            position: absolute;
            width: 8px;
            height: 200px;
            background: #111;
            left: 50%;
            transform: translateX(-50%);
            top: -180px;
        }

        .id-card {
            width: 320px;
            height: 500px;
            border-radius: 28px;
            background: linear-gradient(145deg, #111, #050505);
            border: 1px solid #222;
            transform-style: preserve-3d;
            box-shadow: 0 50px 80px rgba(0,0,0,.5);
            cursor: grab;
            transition: transform .1s;
        }

        .card-top img {
            width: 110px;
            height: 110px;
            border-radius: 50%;
            object-fit: cover;
            margin: 30px auto;
            display: block;
            border: 3px solid #fff;
        }

        .card-content {
            text-align: center;
            color: white;
        }

        .card-content h2 {
            margin: 0;
            font-size: 30px;
        }

        .card-content h4 {
            color: #aaa;
            font-weight: 400;
        }

        .divider {
            width: 70%;
            height: 1px;
            background: #333;
            margin: 20px auto;
        }

        .portfolio-tag {
            display: inline-block;
            margin-top: 25px;
            padding: 10px 20px;
            border-radius: 50px;
            background: white;
            color: black;
            font-weight: bold;
        }
    </style>
</head>
<body>
<section class="hero">
  <div class="lanyard">
    <div class="hook"></div>

    <div class="id-card" id="card">

      <div class="card-top">
        <img src="ID-card-pic.png" alt="Nandan BM">
      </div>

      <div class="card-content">
        <h2>Nandan BM</h2>
        <h4>Tech Analyst @ Cint</h4>

        <div class="divider"></div>

        <p>Databricks • SQL • APIs</p>
        <p>Grafana • OpenSearch</p>
        <p>Product & Project Management</p>

        <span class="portfolio-tag">
          Portfolio 2026
        </span>
      </div>

    </div>
  </div>
</section>
<script>
const card = document.getElementById("card");

card.addEventListener("mousemove", (e)=>{
    const rect = card.getBoundingClientRect();
    const x = e.clientX - rect.left;
    const y = e.clientY - rect.top;
    const rotateY = ((x / rect.width)-0.5)*25;
    const rotateX = ((y / rect.height)-0.5)*-25;
    card.style.transform =
    `rotateX(${rotateX}deg)
     rotateY(${rotateY}deg)
     translateY(-10px)`;
});

card.addEventListener("mouseleave", ()=>{
    card.style.transform =
    "rotateX(0deg) rotateY(0deg)";
});
</script>
</body>
</html>
